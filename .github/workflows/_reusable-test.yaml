name: Reusable Test

on:
  workflow_call:
    inputs:
      sample_value:
        description: 'A sample value to test'
        required: true
        type: string

permissions:
  contents: read
  
jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Init
        run: |
          echo "Sample value: ${{ inputs.sample_value }}"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Packages
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3.5.1
        with:
          version: 2025.11.10

      - name: Run Tests
        run: |
          uv run pytest --github-report

